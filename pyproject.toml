[project]
name = "small-business-loan-agent"
version = "0.1.0"
description = "A multi-agent system that automates mortgage loan processing with human-in-the-loop approval and repair & resume support. Runs locally with a Gemini API key and SQLite state."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
    "google-adk>=1.31.0",
    "reportlab>=4.4.10",
    "rh-maas-litellm",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "google-adk[eval]>=1.27.4",
    "nest-asyncio>=1.6.0",
    "ipykernel>=6.29.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "a2a-sdk[http-server]>=0.3.4,<2",
]
tracing = [
    "mlflow>=2.16.0",
]
lint = [
    "ruff>=0.9.0",
]
gcs = [
    "google-cloud-storage>=2.0.0",
]
vertexai = [
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0",
    "google-cloud-firestore>=2.21.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
rh-maas-litellm = { git = "https://github.com/rrbanda/rh-maas-litellm.git" }
